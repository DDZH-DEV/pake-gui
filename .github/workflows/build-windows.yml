# Build a Windows .exe with pake-cli on GitHub-hosted Windows runners.
# Installer (MSI/NSIS) is skipped via --iterative-build so users need no local VS.
name: Build Windows EXE (Pake)

on:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to package"
        required: true
        type: string
      name:
        description: "App name"
        required: true
        type: string
      icon:
        description: "Icon URL or repo-relative path (.ico / .png). Empty = site icon"
        required: false
        type: string
        default: ""
      width:
        description: "Window width (px)"
        required: false
        type: string
        default: "1200"
      height:
        description: "Window height (px)"
        required: false
        type: string
        default: "780"
      app_version:
        description: "App version"
        required: false
        type: string
        default: "1.0.0"
      identifier:
        description: "Bundle ID (e.g. com.example.app)"
        required: false
        type: string
        default: ""
      new_window:
        description: "Allow sites to open new windows"
        required: false
        type: boolean
        default: false
      job_id:
        description: "Client job id (from Pake GUI cloud submit)"
        required: false
        type: string
        default: ""

env:
  NODE_VERSION: "22"

jobs:
  build-windows:
    name: Windows EXE
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('.github/workflows/build-windows.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install pake-cli
        run: npm install -g pake-cli

      - name: Build Windows exe
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            "${{ inputs.url }}"
            --name "${{ inputs.name }}"
            --width "${{ inputs.width }}"
            --height "${{ inputs.height }}"
            --app-version "${{ inputs.app_version }}"
            --iterative-build
            --json
          )

          if [ -n "${{ inputs.icon }}" ]; then
            ARGS+=(--icon "${{ inputs.icon }}")
          fi
          if [ -n "${{ inputs.identifier }}" ]; then
            ARGS+=(--identifier "${{ inputs.identifier }}")
          fi
          if [ "${{ inputs.new_window }}" = "true" ]; then
            ARGS+=(--new-window)
          fi

          echo "Running: pake ${ARGS[*]}"
          pake "${ARGS[@]}"

      - name: Collect exe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-windows
          NAME="${{ inputs.name }}"
          PAKE_ROOT="$(npm root -g)/pake-cli"
          found=0

          copy_exe() {
            local f="$1"
            [ -f "$f" ] || return 0
            case "$(basename "$f")" in
              node.exe|npm.exe|npx.exe|cargo.exe|rustc.exe|git.exe|pake.exe) return 0 ;;
            esac
            cp -f "$f" dist-windows/
            found=1
          }

          shopt -s nullglob
          for f in "./${NAME}.exe" ./*.exe; do
            copy_exe "$f"
          done

          if [ "$found" -eq 0 ]; then
            while IFS= read -r -d '' path; do
              copy_exe "$path"
            done < <(find . "$PAKE_ROOT" -maxdepth 8 -type f \( -name "${NAME}.exe" -o -name 'pake-*.exe' \) \
              ! -path '*/node_modules/*' ! -path '*/.cargo/*' ! -path '*/deps/*' -print0 2>/dev/null || true)
          fi

          if [ "$found" -eq 0 ]; then
            while IFS= read -r -d '' path; do
              copy_exe "$path"
            done < <(find "$PAKE_ROOT" -maxdepth 10 -type f -path '*/release/*.exe' \
              ! -path '*/deps/*' -print0 2>/dev/null || true)
          fi

          ls -la dist-windows || true
          if [ "$found" -eq 0 ]; then
            echo "No .exe found after iterative build"
            find . "$PAKE_ROOT" -maxdepth 10 -name '*.exe' 2>/dev/null | head -n 50 || true
            exit 1
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.job_id || inputs.name }}-Windows
          path: dist-windows/
          retention-days: 7
          if-no-files-found: error
